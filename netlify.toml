[build]
  command = "yarn build"
  publish = "dist"
  functions = "serverless/functions"

[dev]
  command = "yarn start"
  functions = "serverless/functions"
  targetPort = 4201
  port = 4200

# The SPA fallback redirect lives in public/_redirects, not here. See #118:
# a [[redirects]] block here also applies to `netlify dev` in proxy mode and
# breaks every Vite module request.
